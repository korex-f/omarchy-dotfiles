# Declarative Omarchy plugin inventory; no plugin source is vendored here.
# `enabled` is a live-shell observation. `tested_revision` is a known-good
# recovery point; `tracking_ref` is the channel for future candidate discovery.

schema_version = 2
audited_at = "2026-09-27"
policy_schema_version = 1
policy_updated_at = "2026-10-01"
# An omitted install_policy means undecided, never implicitly exclude/default.
valid_install_policies = ["default", "optional", "host", "exclude", "undecided"]

[builtin_plugins]
policy = "retain-omarchy-managed"
source = "installed-omarchy-package"
# Preserve stock plugins and fallback surfaces; resolve service ownership separately.
activation_policy = "omarchy-defaults-with-reviewed-owner-overrides"
vendor_source = false

