schema_version = 1
# Explicit allowlist; inventory snapshots are NOT deployment permission.
[[area]]
source = ".config/git/config"
component = "cli"
[[area]]
source = ".config/starship.toml"
component = "cli"
[[area]]
source = ".config/nvim"
component = "nvim"
[[area]]
source = ".config/kitty/kitty.conf"
component = "kitty"
[[area]]
source = ".config/zed/settings.json"
component = "zed"
[[area]]
source = ".config/mise/config.toml"
component = "development"
[[area]]
source = ".config/hypr/bindings.lua"
component = "system"

[quarantine]
paths = [".bashrc", ".bash_profile", ".config/omarchy/shell.json"]
reason = "Shell activation and live Omarchy shell.json remain audit snapshots. Only the reviewed Lua bindings module is deployable; legacy Hyprland .conf snapshots, monitors, scaling and other Lua modules are not allowlisted."
